<!doctype html><html><head><meta charset="utf-8"><title>来电 · 预览</title>
<style>
@font-face{font-family:"Ma Shan Zheng";src:url(../assets/fonts/MaShanZheng-Regular.ttf)}
@font-face{font-family:"Noto Sans SC";src:url(../assets/fonts/NotoSansSC-VF.ttf)}
body{margin:0;background:#222}canvas{max-width:100vw;height:auto;display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
// 预览页：?mod=js/xxx.js&w=1920&h=1080[&t=秒 | &arg=参数]
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
try {
  if (q.has('debug')) window.__DEBUG = JSON.parse(q.get('debug'));
  const mod = await import('../' + q.get('mod'));
  await Promise.all([document.fonts.load('40px "Ma Shan Zheng"', '来电'), document.fonts.load('40px "Noto Sans SC"', '来电')]);
  window.DURATION = mod.DURATION || 0;
  window.render = async (arg) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); await (mod.render ? mod.render(ctx, arg, W, H) : mod.renderFrame(ctx, +arg || 0, W, H)); };
  window.renderFrame = async (t) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); await mod.renderFrame(ctx, t, W, H); };
  window.__ready = true;
  if (q.has('t') || q.has('arg')) window.render(q.get('arg') ?? q.get('t'));
} catch (e) { window.__error = String(e && e.stack || e); console.error(e); }
</script></body></html>
