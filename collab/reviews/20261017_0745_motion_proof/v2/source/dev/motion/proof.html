<!doctype html><html lang="zh"><meta charset="utf-8"><title>3 秒代码骨架动作验证</title>
<style>body{margin:0;background:#292a29;color:#eee;font:15px system-ui}main{max-width:960px;margin:20px auto}canvas{display:block;width:100%;background:#eee9dd}nav{display:flex;gap:16px;align-items:center;margin-top:14px}input[type=range]{flex:1}p{color:#c9cbc9;font-size:13px}</style>
<main><canvas id="c" width="960" height="540"></canvas><nav><button id="play">暂停</button><input id="time" type="range" min="0" max="2.958333" step="0.041666667" value="0"><span id="stamp">0.000 s</span><label><input id="bones" type="checkbox">骨架/接点</label></nav><p>运动验证底稿 · 3 秒 / 24 fps · 单镜头 · 既有剪纸代码造型，未经正式人物美术验收</p></main>
<script type="module">import{renderFrame}from'../../js/motion/pullcord_proof.js';const c=document.getElementById('c'),x=c.getContext('2d'),slider=document.getElementById('time'),stamp=document.getElementById('stamp'),bones=document.getElementById('bones'),button=document.getElementById('play');let running=true,start=performance.now(),t=0;function draw(){renderFrame(x,t,960,540,{skeleton:bones.checked});slider.value=t;stamp.textContent=t.toFixed(3)+' s';}button.onclick=()=>{running=!running;if(running)start=performance.now()-t*1000;button.textContent=running?'暂停':'播放';};slider.oninput=()=>{t=+slider.value;running=false;button.textContent='播放';draw();};bones.onchange=draw;function tick(now){if(running){t=Math.floor(((now-start)/1000%3)*24)/24;draw();}requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>
