<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>html,body{margin:0;background:#111}canvas{display:block}</style><canvas id="frame"></canvas>
<script>globalThis.__DEBUG={sheetRes:450};</script>
<script type="module">
import{renderFrame}from'./s31_complete_candidate.js';
const params=new URLSearchParams(location.search),W=+(params.get('w')||1920),H=+(params.get('h')||1080),cv=document.querySelector('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d',{willReadFrequently:true});
window.captureCurrentRGBA=()=>{const a=ctx.getImageData(0,0,W,H).data;let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)};
window.captureCleanB180=async()=>{ctx.setTransform(1,0,0,1,0,0);await renderFrame(ctx,7.5,W,H);return window.captureCurrentRGBA()};
window.drawS31Frame=async f=>{await renderFrame(ctx,f/24,W,H);return{frame:f,time:f/24}};
window.ready=true;
</script>
