ry="21" fill="#c8c6c4" stroke="#303b46" stroke-width="2" /><ellipse cx="-43" cy="43" rx="3" ry="3" fill="#bf4d43" stroke="#303b46" stroke-width="0.7" /><ellipse cx="-47" cy="37" rx="3" ry="3" fill="#bf4d43" stroke="#303b46" stroke-width="0.7" /><ellipse cx="-47" cy="30" rx="3" ry="3" fill="#bf4d43" stroke="#303b46" stroke-width="0.7" /><path d="M -29 27 C -34 7 -15 -6 11 0 C 36 2 42 18 36 37 L 42 52 L 51 57 Q 55 62 46 66 L 42 82 Q 31 101 8 101 Q -12 98 -20 83 L -27 64 Z" fill="#f7d3ba" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="-19" cy="63" rx="10" ry="13" fill="#efbfa6" stroke="#303b46" stroke-width="1.3" /><path d="M -29 61 C -48 35 -36 4 -9 -1 C 16 -8 43 3 42 29 Q 28 19 15 20 Q 6 46 -9 53 L -20 64 Z" fill="#cbc9c8" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M -30 23 Q -11 3 27 9 M -34 35 Q -4 20 19 13 M -25 47 Q 0 36 18 20" fill="none" stroke="#8b8c8c" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" /><path d="M 21 52 Q 31 47 37 52" fill="none" stroke="#303b46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M 24 76 Q 42 72 43 77 Q 37 94 25 87 Z" fill="#a75b58" stroke="#303b46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 25 77 L 41 77 L 38 80 L 27 81 Z" fill="#fff6eb" stroke="#303b46" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="28" cy="54" rx="12" ry="15" fill="none" stroke="#303b46" stroke-width="1.8" /><ellipse cx="45" cy="55" rx="5" ry="12" fill="none" stroke="#303b46" stroke-width="1.3" /><line x1="-12" y1="52" x2="17" y2="52" stroke="#303b46" stroke-width="2" /></g><path d="M -28.39724913906026 204.9240217097985 Q 3.4568086194735663 233.18740799516758 37.89463534387209 258.39724913906025 A 11 11 0 0 1 52.10536465612791 241.60275086093975 Q 21.54319138052643 211.81259200483242 -11.60275086093974 185.0759782902015 A 13 13 0 0 1 -28.39724913906026 204.9240217097985 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="-20" y1="195" x2="45" y2="250" stroke="#6f7a86" stroke-width="0.9" stroke-dasharray="4 4"/><ellipse cx="45" cy="250" rx="11" ry="4.4" fill="none" stroke="#71818b" stroke-width="1" transform="rotate(130.2363583092738 45 250)"/><path d="M 39.09436958587525 240.71972363494683 Q 11.59436958587525 258.21972363494683 -13.758128445352115 279.09436958587526 A 7 7 0 0 1 -6.241871554647885 290.90563041412474 Q 23.40563041412475 276.78027636505317 50.90563041412475 259.28027636505317 A 11 11 0 0 1 39.09436958587525 240.71972363494683 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="45" y1="250" x2="-10" y2="285" stroke="#6f7a86" stroke-width="0.9" stroke-dasharray="4 4"/><ellipse cx="-10" cy="285" rx="7" ry="2.8000000000000003" fill="none" stroke="#71818b" stroke-width="1" transform="rotate(237.52880770915152 -10 285)"/><ellipse cx="-70" cy="195" rx="19" ry="16" fill="#99b9d8" stroke="#303b46" stroke-width="1.8" /><ellipse cx="-20" cy="195" rx="19" ry="16" fill="#99b9d8" stroke="#303b46" stroke-width="1.8" /></g><text x="900.0" y="595.0" font-size="17" fill="#303b46" font-weight="400">R肩</text><text x="868.0" y="735.0" font-size="17" fill="#303b46" font-weight="400">R肘</text><text x="684.8" y="791.2" font-size="22" fill="#303b46" font-weight="650">奶奶R</text><text x="980.0" y="595.0" font-size="17" fill="#303b46" font-weight="400">L肩</text><text x="1084.0" y="695.0" font-size="17" fill="#303b46" font-weight="400">L肘</text><text x="940.8" y="796.0" font-size="22" fill="#303b46" font-weight="650">奶奶L</text><line x1="150" y1="540" x2="724.8" y2="747.2" stroke="#f8fafb" stroke-width="9" /><line x1="150" y1="540" x2="724.8" y2="747.2" stroke="#3d7f57" stroke-width="4" /><text x="115" y="510" font-size="23" fill="#3d7f57" font-weight="700">C_B</text><line x1="150" y1="420" x2="724.8" y2="732.2" stroke="#f8fafb" stroke-width="9" /><line x1="150" y1="420" x2="724.8" y2="732.2" stroke="#c47b24" stroke-width="4" /><text x="115" y="395" font-size="23" fill="#c47b24" font-weight="700">C_N</text><g transform="translate(692.8 741.2) rotate(0) scale(-1.52 1.52)"><path d="M -26 -12 Q -10 -18 8 -14 Q 22 -12 23 1 Q 22 14 11 17 L -7 15 Q -22 10 -26 9 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 7 -9 Q 20 -13 22 -5 Q 20 2 9 -1 Q 2 -4 7 -9 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 6 -2 Q 19 -6 21 2 Q 19 9 8 6 Q 1 3 6 -2 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 2 5 Q 15 1 17 9 Q 15 16 4 13 Q -3 10 2 5 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M -4 10 Q 9 6 11 14 Q 9 21 -2 18 Q -9 15 -4 10 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M -14 -11 Q -1 -24 14 -15 Q 22 -10 14 -6 L 3 -5 Q -9 6 -15 0 Z" fill="#f9d9c3" stroke="#303b46" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="12" cy="-11" rx="4" ry="3" fill="#ffe9d9" stroke="#9f816d" stroke-width="0.8" /></g><g transform="translate(948.8 746.0) rotate(0) scale(-1.52 1.52)"><path d="M -25 -9 Q -10 -20 12 -15 Q 31 -12 39 -4 Q 42 0 37 4 L 16 1 Q 34 5 37 11 Q 37 16 31 15 L 10 8 Q 29 15 31 20 Q 30 25 23 21 L 4 13 Q 20 23 18 27 Q 14 29 8 23 L -12 12 L -26 9 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="-25" cy="0" rx="4.5" ry="12.5" fill="#6fa787" stroke="#35624e" stroke-width="1.7" /></g><rect x="70" y="335" width="1130" height="570" rx="12" fill="none" stroke="#a7b2ba" stroke-width="2" stroke-dasharray="12 8"/><text x="80" y="320" font-size="21" fill="#303b46" font-weight="400">CAMG中近景意向框；保留下方全身用于骨长／支撑审查</text><text x="140" y="1115" font-size="23" fill="#303b46" font-weight="400">两脚仍承重，膝微屈；笑的变化沿腰髋→胸肩→颈头传递。</text><text x="1320" y="220" font-size="25" fill="#303b46" font-weight="400">F132–143先完成鹤签自交接：</text><text x="1320" y="262" font-size="25" fill="#303b46" font-weight="400">G.R保持C_B；G.L把C_N送入R虎口并夹牢。</text><text x="1320" y="304" font-size="25" fill="#303b46" font-weight="400">确认R拇指＋屈指同时压住两杆后，L才移到腹前。</text><text x="1320" y="346" font-size="25" fill="#303b46" font-weight="400">F144切景不会把“两手握”凭空变成“单手并”。</text><line x1="1380" y1="530" x2="2250" y2="680" stroke="#f8fafb" stroke-width="9" /><line x1="1380" y1="530" x2="2250" y2="680" stroke="#3d7f57" stroke-width="4" /><text x="1340" y="495" font-size="23" fill="#3d7f57" font-weight="700">C_B 身签</text><line x1="1380" y1="590" x2="2250" y2="705" stroke="#f8fafb" stroke-width="9" /><line x1="1380" y1="590" x2="2250" y2="705" stroke="#c47b24" stroke-width="4" /><text x="1340" y="645" font-size="23" fill="#c47b24" font-weight="700">C_N 颈签</text><g transform="translate(1945 654) rotate(8) scale(-4.3 4.3)"><path d="M -26 -12 Q -10 -18 8 -14 Q 22 -12 23 1 Q 22 14 11 17 L -7 15 Q -22 10 -26 9 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 7 -9 Q 20 -13 22 -5 Q 20 2 9 -1 Q 2 -4 7 -9 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 6 -2 Q 19 -6 21 2 Q 19 9 8 6 Q 1 3 6 -2 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 2 5 Q 15 1 17 9 Q 15 16 4 13 Q -3 10 2 5 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M -4 10 Q 9 6 11 14 Q 9 21 -2 18 Q -9 15 -4 10 Z" fill="#f4cdb2" stroke="#303b46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M -14 -11 Q -1 -24 14 -15 Q 22 -10 14 -6 L 3 -5 Q -9 6 -15 0 Z" fill="#f9d9c3" stroke="#303b46" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="12" cy="-11" rx="4" ry="3" fill="#ffe9d9" stroke="#9f816d" stroke-width="0.8" /></g><ellipse cx="1930" cy="649" rx="75" ry="65" fill="none" stroke="#798790" stroke-width="1.5" /><text x="1840" y="790" font-size="24" fill="#303b46" font-weight="400">R裸腕：双杆各自有接触带</text><text x="1320" y="875" font-size="23" fill="#303b46" font-weight="400">左腕玉镯只在L，随前臂来到腹前，不随旧镜像换到R。</text><text x="1320" y="917" font-size="23" fill="#303b46" font-weight="400">扶腹是有意掌腹接触；袖口→肘→腕→掌在衣前完整可追。</text><text x="1320" y="959" font-size="23" fill="#303b46" font-weight="400">鹤两杆仍分别去body／neck3，不合成一杆、不增第三杆。</text><text x="1320" y="1001" font-size="23" fill="#303b46" font-weight="400">小满及龟在CAMG画外，仍由她R头签／L壳签持住。</text><rect x="35" y="1200" width="2330" height="265" rx="18" fill="#fff" stroke="#d2dae0" stroke-width="2"/><text x="55" y="1241" font-size="29" fill="#303b46" font-weight="650">共用施工尺与制作边界</text><text x="60" y="1295" font-size="23" fill="#303b46" font-weight="400">G：身高4.8H；小满：身高4.7H，H_X=0.90H_G，约0.88成人高度。目标来自实际母版比例阅读，待冻结。</text><text x="60" y="1332" font-size="23" fill="#303b46" font-weight="400">骨长施工目标：奶奶上臂1.00H／前臂0.90H／手0.50H；小满0.90H／0.80H／0.45H。不是二维图反推的实测三维骨长。</text><text x="60" y="1369" font-size="23" fill="#303b46" font-weight="400">近臂实肤色、躯干衣块、远臂灰色；截面椭圆表示短缩，灰虚线表示遮挡。L/R始终按角色自身。</text><text x="60" y="1406" font-size="23" fill="#303b46" font-weight="400">F144–215笑的每次回弹都重画整胸／肩／头关系，不用肩抖、脸形变或整张图伸缩代动作。</text></svg>