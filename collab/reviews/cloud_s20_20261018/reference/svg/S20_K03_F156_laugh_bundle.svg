<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500"><style>text{font-family:RefSC,"Noto Sans SC",sans-serif} @font-face{font-family:RefSC;src:url("/assets/fonts/NotoSansSC-VF.ttf")}</style><desc>Human-authored static construction reference, zero image-model calls, not a production character drawing.</desc><rect width="2400" height="1500" fill="#eef2f4"/><text x="45" y="59" font-size="38" fill="#303b46" font-weight="750">S20 · K03  F156：腰髋带笑，R并鹤双签，L扶腹</text><text x="45" y="104" font-size="24" fill="#303b46" font-weight="400">F144／6.0秒保留原CAMG切奶奶中近景；这里补完整下肢施工，不据全身示意改机位。</text><rect x="35" y="135" width="1225" height="1040" rx="18" fill="#fff" stroke="#d2dae0" stroke-width="2"/><text x="55" y="176" font-size="29" fill="#303b46" font-weight="650">完整体量／手别施工参考 · 不是曝光成品</text><rect x="1290" y="135" width="1075" height="1040" rx="18" fill="#fff" stroke="#d2dae0" stroke-width="2"/><text x="1310" y="176" font-size="29" fill="#303b46" font-weight="650">真实握持、层次与不变量</text><g transform="translate(1000 290) scale(1.6)"><path d="M -6 320 Q -14 405 -18 490 L 31 493 Q 31 405 33 320 Z" fill="#929eaf" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(5 490) scale(1 1)"><path d="M -12 -1 Q -27 5 -43 10 Q -55 14 -49 20 L 23 20 Q 29 9 12 1 Z" fill="#333c47" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="-48" y1="17" x2="22" y2="17" stroke="#eee7dc" stroke-width="3" /></g><path d="M 33 320 Q 48 407 62 490 L 111 493 Q 93 407 72 320 Z" fill="#555f76" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(85 490) scale(1 1)"><path d="M -12 -1 Q -27 5 -43 10 Q -55 14 -49 20 L 23 20 Q 29 9 12 1 Z" fill="#333c47" stroke="#303b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="-48" y1="17" x2="22" y2="17" stroke="#eee7dc" stroke-width="3" /></g><path d="M -82.61185250188932 191.